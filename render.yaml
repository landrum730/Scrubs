# Free web hosting. Persistent storage uses a separately created free Supabase project.
services:
  - type: web
    name: scrubs
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: SCRUBS_ADMIN_TOKEN
        generateValue: true
      - key: SCRUBS_STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SCRUBS_ORDER_EMAIL
        value: manager@landrument.com
      - key: SCRUBS_EMAIL_FROM
        value: manager@landrument.com
